[package]
name = "uu_wall"
version = "0.0.1"
description = "wall ~ write a message to all users"

edition = "2021"

[lib]
path = "src/wall.rs"

[[bin]]
name = "wall"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap.workspace = true
libc.workspace = true
uucore = { workspace = true, features = ["utmpx"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["fs", "hostname", "poll", "term"] }
thiserror.workspace = true
