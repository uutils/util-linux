[package]
name = "uu_chrt"
version = "0.0.1"
edition = "2021"
description = "chrt ~ (uutils) Show or change the real-time scheduling attributes of a process"

[lib]
path = "src/chrt.rs"

[[bin]]
name = "chrt"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true, features = ["signals"] }
